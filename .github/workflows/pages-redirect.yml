name: Pages redirect
# GitHub Pages is retired: miisodev.github.io/instinct/* redirects to instinct.miiso.dev/*.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages-redirect.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
